name: Demo - Deploy with composite action

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment for the composite-action demo
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy through local composite action
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run copied deployment steps
        uses: ./.github/actions/deploy-gcp
        with:
          environment: ${{ inputs.environment }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}