name: Demo 04 - Environment approvals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    name: Development deployment
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to development
        run: echo "Development workflow is running in the dev environment."

  production:
    name: Production deployment
    runs-on: ubuntu-latest
    needs: development
    environment: prod
    steps:
      - name: Deploy to production
        run: echo "Production workflow is running in the prod environment."