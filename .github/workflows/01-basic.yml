name: Demo 01 - Basic workflow

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 9 * * 1-5" # Weekdays at 09:00 UTC
  #   - cron: "0 0 * * 0"   # Sundays at midnight UTC
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

jobs:
  hello:
    name: Say hello
    runs-on: ubuntu-latest
    steps:
      - name: Print context
        run: |
          echo "Hello from GitHub Actions"
          echo "Repository: ${{ github.repository }}"
          echo "Triggered by: ${{ github.event_name }}"

  goodbye:
    name: Say goodbye
    runs-on: ubuntu-latest
    needs: hello
    steps:
      - name: Print completion message
        run: echo "The second job ran after the first job completed."